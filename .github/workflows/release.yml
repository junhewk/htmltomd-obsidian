name: Release BRAT assets

on:
  push:
    tags: ['*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify tag and manifest versions match
        run: node -e "const m=require('./manifest.json'); if (m.version !== process.env.GITHUB_REF_NAME) { throw new Error('manifest version must equal release tag') }"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
